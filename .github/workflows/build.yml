- name: Clear loom cache
  run: |
    rm -rf ~/.gradle/caches/fabric-loom
    rm -rf .gradle/loom-cachename: Build DobriClient
 on:
  workflow_dispatch:
  push:
    branches: [ main ]

 jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11'
      - name: Build
        run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: dobriclient-jar
          path: build/libs/*[!sources].jar
